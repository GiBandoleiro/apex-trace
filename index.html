<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07090f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Apex Trace - draw the racing line, manage your speed, win the race. A premium browser racing game for mobile and desktop."
    />
    <title>Apex Trace — Draw. Race. Win.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #07090f;
        overscroll-behavior: none;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(120% 90% at 50% 0%, #131a2a 0%, #07090f 62%);
        color: #e8edf7;
        font-family: 'Barlow Condensed', system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.35s ease;
      }
      #boot .mark {
        font-size: clamp(34px, 8vw, 64px);
        letter-spacing: 0.22em;
        font-weight: 700;
        text-transform: uppercase;
      }
      #boot .mark span {
        color: #ff8a3d;
      }
      #boot .bar {
        width: min(280px, 60vw);
        height: 3px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 99px;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #ff8a3d, #ffc46b);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(340%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="mark">APEX<span>TRACE</span></div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
